name: Track & Build Magpie with AGY

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）检查上游更新
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: build-magpie-agy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check upstream versions
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # 1. GHCR 镜像名强制全小写
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          # 2. 获取上游 magpie:stable 最新 manifest digest
          MAGPIE_DIGEST=$(docker buildx imagetools inspect ghcr.io/yetone/magpie:stable --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$MAGPIE_DIGEST"

          # 3. 临时拉取 agy 提取真实版本号（约 3~5 秒）
          mkdir -p /tmp/agy-check
          curl -fsSL https://antigravity.google/cli/install.sh \
            | HOME=/tmp/agy-check bash -s -- --skip-aliases --skip-path
          AGY_VERSION=$(HOME=/tmp AGY_CLI_DISABLE_AUTO_UPDATE=true /tmp/agy-check/.local/bin/agy --version | head -n 1 | tr -d '\r')
          rm -rf /tmp/agy-check
          test -n "$AGY_VERSION"

          echo "magpie_digest=${MAGPIE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "agy_version=${AGY_VERSION}" >> "$GITHUB_OUTPUT"

          # 4. 精确比对版本文件
          printf "magpie=%s\nagy=%s\n" "$MAGPIE_DIGEST" "$AGY_VERSION" > /tmp/versions.new

          if [ ! -f versions.txt ] || ! cmp -s versions.txt /tmp/versions.new || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游变更：magpie=${MAGPIE_DIGEST}, agy=${AGY_VERSION}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无更新，跳过构建。"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          # 若 VPS 为 ARM64：改为 linux/arm64，并在 Buildx 前加一步 uses: docker/setup-qemu-action@v4
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          build-args: |
            AGY_VERSION=${{ steps.check.outputs.agy_version }}
          tags: |
            ${{ steps.check.outputs.image_name }}:latest
            ${{ steps.check.outputs.image_name }}:${{ github.run_number }}

      - name: Commit updated versions.txt
        if: steps.check.outputs.changed == 'true'
        env:
          AGY_VERSION: ${{ steps.check.outputs.agy_version }}
        run: |
          cp /tmp/versions.new versions.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump upstream (agy ${AGY_VERSION})"
            git push
          fi
