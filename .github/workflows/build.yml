name: Track & Build Magpie with AGY

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

concurrency:
  group: build-magpie-agy
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      image_name: ${{ steps.check.outputs.image_name }}
      magpie_digest: ${{ steps.check.outputs.magpie_digest }}
      agy_version: ${{ steps.check.outputs.agy_version }}
      source_sha: ${{ steps.check.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check upstream versions
        id: check
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          MAGPIE_DIGEST=$(
            docker buildx imagetools inspect ghcr.io/yetone/magpie:stable \
              --format '{{.Manifest.Digest}}'
          )

          if [[ ! "$MAGPIE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid Magpie digest: ${MAGPIE_DIGEST}"
            exit 1
          fi

          AGY_DIR="${RUNNER_TEMP}/agy-check"
          AGY_HOME="${RUNNER_TEMP}/agy-home"

          mkdir -p "$AGY_DIR" "$AGY_HOME"

          curl -fsSL https://antigravity.google/cli/install.sh \
            | HOME="$AGY_HOME" bash -s -- --dir "$AGY_DIR"

          AGY_VERSION=$(
            HOME="$AGY_HOME" AGY_CLI_DISABLE_AUTO_UPDATE=true \
              "${AGY_DIR}/agy" --version 2>&1
          )

          if [[ ! "$AGY_VERSION" =~ ^[0-9]+(\.[0-9]+){2}([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "::error::Invalid agy version: ${AGY_VERSION}"
            exit 1
          fi

          printf 'magpie=%s\nagy=%s\n' \
            "$MAGPIE_DIGEST" "$AGY_VERSION" > "${RUNNER_TEMP}/versions.new"

          {
            echo "image_name=${IMAGE_NAME}"
            echo "magpie_digest=${MAGPIE_DIGEST}"
            echo "agy_version=${AGY_VERSION}"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          cat "${RUNNER_TEMP}/versions.new"

          if [ "$GITHUB_EVENT_NAME" != schedule ] \
            || ! cmp -s versions.txt "${RUNNER_TEMP}/versions.new"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream versions unchanged."
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          build-args: |
            MAGPIE_IMAGE=ghcr.io/yetone/magpie@${{ needs.check.outputs.magpie_digest }}
            AGY_VERSION=${{ needs.check.outputs.agy_version }}
          tags: |
            ${{ needs.check.outputs.image_name }}:latest
            ${{ needs.check.outputs.image_name }}:${{ github.run_number }}

      - name: Update versions.txt
        shell: bash
        env:
          MAGPIE_DIGEST: ${{ needs.check.outputs.magpie_digest }}
          AGY_VERSION: ${{ needs.check.outputs.agy_version }}
        run: |
          set -euo pipefail

          printf 'magpie=%s\nagy=%s\n' \
            "$MAGPIE_DIGEST" "$AGY_VERSION" > versions.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump upstream (agy ${AGY_VERSION})"
            git fetch origin main
            git rebase FETCH_HEAD
            git push origin HEAD:main
          fi
